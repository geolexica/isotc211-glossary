  definition:
  - content: referring to the study, maintenance or conservation of a specimen or
      population without removing it from its natural surroundings
  examples: []
  id: '2891'
  notes:
  - content: Opposite of ex situ (off-site).
  - content: An example of in situ and direct is measuring a patient's temperature
      with a mercury thermometer in the patient's rectum.
  - content: An example of in situ and remote is measuring a patient's temperature
      with an infra-red thermometer at a distance.
