  definition:
  - content: sistema de referencia por coordenadas tridimensional que se fundamenta
      en un marco de referencia geodésico y que tiene o un sistema de coordenadas
      cartesianas o uno esférico
  examples: []
  id: '2368'
  notes:
  - content: NOTA  En este documento un sistema de referencia por coordenadas fundamentado
      en un marco de referencia geodésico y teniendo un sistema de coordenadas elipsoidal
      se denomina geográfico.
